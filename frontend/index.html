<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sakha — the Gita, as a friend</title>
    <meta name="description" content="Bring what you feel to the Bhagavad Gita and hear what it says, in plain words. All 701 verses, daily practices, a private journal — offline, on your device." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbf6ec" />

    <!-- Installable app -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sakha" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Type -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Mukta:wght@300;400;500;600&family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Noto+Serif+Devanagari:wght@400;500&display=swap" rel="stylesheet">

    <script>
      /* Choose dawn or night before anything paints — no flash of the wrong light. */
      (function () {
        var choice = 'dawn';
        try { choice = (JSON.parse(localStorage.getItem('livingGitaSettings') || '{}').theme) || 'dawn'; } catch (e) {}
        var hour = new Date().getHours();
        var theme = choice === 'auto' ? (hour >= 5 && hour < 19 ? 'dawn' : 'night') : choice;
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.background = theme === 'dawn' ? '#fbf6ec' : '#0d0e15';
        root.style.colorScheme = theme === 'dawn' ? 'light' : 'dark';
      })();
    </script>
    <style>
      html, body { margin: 0; }
      html[data-theme="dawn"], html[data-theme="dawn"] body { background: #fbf6ec; color: #2a1c10; }
      html[data-theme="night"], html[data-theme="night"] body { background: #0d0e15; color: #efe4cd; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: Georgia, serif; text-align: center; padding: 4rem 1.5rem; line-height: 1.6;">
        Sakha needs JavaScript to light the lamp.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
